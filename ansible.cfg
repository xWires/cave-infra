# https://www.jeffgeerling.com/blog/2020/ansible-best-practices-using-project-local-collections-and-roles/
[defaults]

# Installs collections into [current dir]/ansible/vendor/ansible_collections/namespace/collection_name
collections_path = ./ansible/vendor

# Installs roles into [current dir]/ansible/vendor/roles/namespace.rolename
roles_path = ./ansible/roles:./ansible/vendor/roles

remote_user = root
---
- name: Configure all Windows servers
  hosts: windows_servers
  roles:
    - windows_server_rdp
    - windows_server_backup

- name: Configure domain controller(s)
  hosts: ad_dcs
  vars_prompt:
    - name: ad_safe_mode_password
      prompt: Enter the safe mode password for the domain
      private: true
  roles:
    - ad_dc

- name: Configure Exchange server(s)
  hosts: exchange_servers
  roles:
    - exchange
